name: Secret scan

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]

jobs:
  scan:
    name: Scan for committed credentials
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run repository secret scan
        run: ./tools/scan_secrets.sh
