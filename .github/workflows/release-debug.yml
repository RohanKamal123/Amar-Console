name: Publish debug APK

# Keeps one rolling release, `debug-latest`, whose asset URL never changes:
#   https://github.com/RohanKamal123/Amar-Console/releases/download/debug-latest/app-debug.apk
# Bookmark that on the phone and every run replaces it with the newest build.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  # As in android.yml: gradle.properties caps the heap for the development container,
  # which is far below what a runner needs to merge dex.
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8

jobs:
  publish:
    name: Build and publish the debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Publish the rolling debug release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Replace the previous rolling release so the download URL stays stable.
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Debug build ${GITHUB_SHA::7}" \
            --prerelease \
            --notes "Unsigned debug build of \`${GITHUB_SHA::7}\`.

          Install on a phone: open this page in the phone's browser, download
          \`app-debug.apk\`, and allow installation from that browser when prompted.

          Debug builds are unsigned and use the \`.debug\` application id, so they
          install alongside a release build rather than replacing it."
